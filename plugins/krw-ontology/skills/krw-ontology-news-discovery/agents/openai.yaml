interface:
  display_name: "KRW Ontology News Discovery"
  short_description: "Market-news event cards for KRW Ontology analysis"
  default_prompt: "Use $krw-ontology-news-discovery only for the first step of news mode. Curate recent market-news event candidates that a user can choose before KRW Ontology filing analysis. Use stock-news discovery tools only, prefer Yahoo Finance, Reuters, Bloomberg, CNBC, WSJ, MarketWatch, AP, Barron's, FT, and major market-news sources, exclude SEC filings, Form 8-K/10-Q/10-K, Investor Relations, company IR pages, old filings, and standalone official filing pages from user-facing cards. Generate concise Korean event-card titles and summaries plus hidden English ontology bridge briefs in the tool/card payload. Do not call read_news_sources or KRW Ontology tools, do not write final investment analysis, do not expose internal English briefs, tool names, schema terms, or JSON. Visible output should be only a short Korean 안내문 telling the user to choose a candidate for filing-based analysis; if zero usable cards remain after filtering, say no market-news candidate was found and ask for a more specific company or period."
