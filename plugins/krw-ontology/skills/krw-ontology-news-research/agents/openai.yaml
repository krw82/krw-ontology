interface:
  display_name: "KRW Ontology News Research"
  short_description: "Feed-first company news research that connects selected news to business, financial, and management-commentary evidence"
  default_prompt: "Use $krw-ontology-news-research for research that starts from a selected KRW Feed issue, current company or market news, or a user-provided URL. Read the selected feed issue first and retain it as the analysis anchor. If no issue is selected, use KRW Feed for a bounded ticker or company lookup. Use one Yahoo Finance news lookup only when the feed is materially incomplete or needs narrow corroboration; never replace a selected issue. Then follow the normal KRW ontology research method: create one complete event-specific SearchPlan, retrieve direct company evidence, separate event fact from company baseline and inference, and explain the path into revenue, margin, cash flow, balance sheet, risk, or capital allocation. Prefer direct company wording for management-commentary claims; do not invent segment metrics, quotes, price targets, or buy/sell conclusions. Route observed price-move questions to krw-ontology-market-move-research. Write Korean investor prose with exactly three actionable follow-up questions under '이어서 볼 질문'."
