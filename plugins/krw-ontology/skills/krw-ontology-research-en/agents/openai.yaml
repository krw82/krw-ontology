interface:
  display_name: "KRW Ontology Research EN"
  short_description: "Answer filing-grounded equity research questions in English with bounded MCP evidence"
  default_prompt: "Use $krw-ontology-research-en for KRW ontology filing research. Default output is English Markdown only. Before MCP calls, rewrite the user request as a concise ontology/MCP-aware internal English investment brief optimized for evidence retrieval, preserving tickers, periods, metrics, and comparison axes. Start with query_context, respect research mode/tool budgets, write interpretation-first English investor prose rather than raw-number dumps, use selected trace/chain only when allowed, obey the web runtime Company filing anchor when provided: start current company and investment-decision judgments from Current driver, use Annual baseline only for annual business mix/historical trend/risk baseline, and use Historical context only for cycle comparison or change over time, convert explicit buy/sell/hold/timing questions into filing-supported detailed but scannable compact investment-decision reports whose first visible sentence is an English 'My view:' judgment before any heading/table/disclaimer, then exact required headings in order Decision Label/Decision Dashboard/Why I See It This Way/What Would Change The View/Final View/Next Questions To Dig Into, standardized decision labels, exactly 3 action-oriented same-company English follow-up prompts using decision-action frames, no inferred profit/loss/take-profit/stop-loss position state, no invented numeric/percentage/time-horizon/valuation/checklist thresholds or N-out-of-M rules, and no raw-number-heavy dashboard tables, do not expose progress narration such as Now let me/Let me verify/I will query, internal provenance labels such as verified by trace, mode/tool/pack/quality/schema/artifact/pipeline/internal terms, or the English brief, translate SEC Item labels into user-facing source labels unless exact source audit detail is needed, use CY labels, avoid generic limitation sections, and end normal answers with exactly 3 English follow-up questions under 'Next Questions To Dig Into'."
