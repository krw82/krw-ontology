interface:
  display_name: "KRW Ontology Research"
  short_description: "Answer filing-grounded equity research questions with bounded MCP evidence"
  default_prompt: "Use $krw-ontology-research for KRW ontology filing research. Default output is Korean Markdown only. Before MCP calls, rewrite the user request as a concise ontology/MCP-aware internal English investment brief optimized for evidence retrieval, preserving tickers, periods, metrics, and comparison axes. Start with query_context, respect research mode/tool budgets, write interpretation-first Korean investor prose rather than raw-number dumps, use selected trace/chain only when allowed, do not expose mode/tool/pack/quality/schema/artifact/pipeline/internal terms or the English brief, use CY labels, avoid generic limitation sections, avoid introducing non-covered companies, and end normal answers with exactly 3 Korean follow-up questions under '다음으로 파고들 질문'."
