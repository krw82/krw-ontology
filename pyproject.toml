[project]
name = "krw-ontology"
version = "0.1.0"
description = "10-K Evidence Ontology Builder — file-canonical equity research pipeline"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0,<2.13",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.12",
    "lxml>=5.0",
    "claude-agent-sdk==0.2.85",
    "pyyaml>=6.0",
    "rich>=13.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
krw-ontology = "krw_ontology.cli.main:app"
krw-ontology-mcp = "krw_ontology.mcp_server.http_server:main"
krw-ontology-mcp-stdio = "krw_ontology.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"ontology/taxonomy/factors.yaml" = "krw_ontology/resources/taxonomy/factors.yaml"
"ontology/taxonomy/sector_expectations.yaml" = "krw_ontology/resources/taxonomy/sector_expectations.yaml"
"ontology/registry.yaml" = "krw_ontology/resources/registry.yaml"
"ontology/schema/metric_dictionary.yaml" = "krw_ontology/resources/schema/metric_dictionary.yaml"
"ontology/schema/relations.yaml" = "krw_ontology/resources/schema/relations.yaml"
"ontology/sector_packs/generic.yaml" = "krw_ontology/resources/sector_packs/generic.yaml"
"ontology/sector_packs/energy_lng.yaml" = "krw_ontology/resources/sector_packs/energy_lng.yaml"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that require network or API calls",
]
